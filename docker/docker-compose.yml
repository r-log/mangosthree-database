# A database server for MaNGOS Three, for people who only need the databases (the full
# realmd + mangosd stack lives in the server repository's extra/docker/).
#
#   docker compose up -d
#   ./docker-compose.sh          # installs the three databases into it, unattended
#
# Data persists in the named volume `dbdata`; `docker compose down -v` wipes it.
name: mangosthree-db

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mangos}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  dbdata:
